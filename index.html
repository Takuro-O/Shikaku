<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff7ed">
<title>合格ダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fffdf9;
  --surface: #ffffff;
  --border: #f0ebe2;
  --text: #1c1410;
  --sub: #9e8e7e;
  --orange: #f97316;
  --orange-light: #fff3e8;
  --orange-mid: #fed7aa;
  --yellow: #fbbf24;
  --green: #22c55e;
  --green-light: #f0fdf4;
  --red: #ef4444;
  --red-light: #fef2f2;
  --purple: #8b5cf6;
  --blue: #3b82f6;
  --blue-light: #eff6ff;
  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 24px;
  --shadow-card: 0 1px 4px rgba(0,0,0,0.06);
  --transition: 0.18s ease;
  --z-header: 100;
  --z-nav: 100;
  --z-modal: 500;
  --z-toast: 999;
}

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

#app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
input, textarea, select { font-family: inherit; font-size: 16px; }

.tappable { transition: transform var(--transition), opacity var(--transition); -webkit-tap-highlight-color: transparent; }
.tappable:active { transform: scale(0.97); opacity: 0.85; }

/* ─── Header ─── */
header {
  position: sticky; top: 0; z-index: var(--z-header);
  background: rgba(255,253,249,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 16px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-logo {
  font-family: 'Nunito', sans-serif;
  font-size: 20px; font-weight: 900; letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--orange), var(--yellow));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-date {
  font-size: 13px; color: var(--sub);
  background: var(--orange-light);
  border: 1px solid var(--orange-mid);
  padding: 4px 10px; border-radius: 20px;
}

/* ─── Main ─── */
main {
  flex: 1; overflow-y: auto;
  padding: 0 0 calc(80px + env(safe-area-inset-bottom));
}

.page { display: none; }
.page.active { display: block; }

/* ─── Hero Section ─── */
.hero-wrap { padding: 20px 16px 0; }

.cert-tab-row {
  display: flex; gap: 8px; margin-bottom: 16px;
  overflow-x: auto; padding-bottom: 2px;
  scrollbar-width: none;
}
.cert-tab-row::-webkit-scrollbar { display: none; }
.cert-tab {
  flex-shrink: 0; padding: 10px 14px; min-height: 44px;
  border-radius: var(--radius-s);
  border: 1.5px solid var(--border);
  background: var(--surface); font-size: 13px; font-weight: 700;
  color: var(--sub); white-space: nowrap;
  transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.cert-tab.active {
  border-color: var(--orange);
  background: var(--orange-light);
  color: var(--orange);
}

.hero-card {
  background: linear-gradient(135deg, #ff8c42 0%, #f97316 40%, #fb923c 70%, #fbbf24 100%);
  border-radius: var(--radius-l);
  padding: 24px 20px 20px;
  color: #fff;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(249,115,22,0.35);
  margin-bottom: 16px;
}
.hero-card::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.12); border-radius: 50%;
}
.hero-card::after {
  content: ''; position: absolute; bottom: -50px; left: -20px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.08); border-radius: 50%;
}
.hero-cert-name {
  font-size: 13px; font-weight: 700;
  opacity: 0.85; margin-bottom: 4px; position: relative; z-index: 1;
}
.hero-days-left {
  font-family: 'Nunito', sans-serif;
  font-size: 64px; font-weight: 900; line-height: 1;
  position: relative; z-index: 1;
  text-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.hero-days-label {
  font-size: 14px; font-weight: 700; opacity: 0.85;
  position: relative; z-index: 1; margin-bottom: 20px;
}
.hero-stats { display: flex; gap: 12px; position: relative; z-index: 1; }
.hero-stat {
  flex: 1; background: rgba(255,255,255,0.22);
  border-radius: var(--radius-s); padding: 10px 12px;
  backdrop-filter: blur(4px);
}
.hero-stat-val {
  font-family: 'Nunito', sans-serif;
  font-size: 22px; font-weight: 900; line-height: 1;
}
.hero-stat-key { font-size: 11px; opacity: 0.85; margin-top: 2px; }

/* ─── Daily Banner ─── */
.daily-banner {
  border-radius: var(--radius-m);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; border: 2px solid;
}
.daily-banner.safe   { background: var(--green-light); border-color: #bbf7d0; }
.daily-banner.warn   { background: #fffbeb;            border-color: #fde68a; }
.daily-banner.danger { background: var(--red-light);   border-color: #fecaca; }
.daily-banner-icon { font-size: 28px; flex-shrink: 0; }
.daily-banner-text { flex: 1; }
.daily-banner-val {
  font-family: 'Nunito', sans-serif;
  font-size: 28px; font-weight: 900; line-height: 1;
}
.daily-banner.safe   .daily-banner-val { color: #16a34a; }
.daily-banner.warn   .daily-banner-val { color: #d97706; }
.daily-banner.danger .daily-banner-val { color: var(--red); }
.daily-banner-desc { font-size: 12px; color: var(--sub); margin-top: 2px; }

/* ─── Sections ─── */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; margin-bottom: 10px; margin-top: 4px;
}
.section-title {
  font-size: 13px; font-weight: 700; color: var(--sub);
  text-transform: uppercase; letter-spacing: 0.8px;
}

/* ─── Progress Cards ─── */
.progress-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-m); padding: 16px;
  margin: 0 16px 12px; box-shadow: var(--shadow-card);
}
.prog-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.prog-name { font-size: 15px; font-weight: 700; }
.prog-pct {
  font-family: 'Nunito', sans-serif;
  font-size: 20px; font-weight: 900;
}
.prog-bar-wrap {
  background: var(--border); border-radius: 6px; height: 10px; overflow: hidden;
  margin-bottom: 8px;
}
.prog-bar-fill {
  height: 100%; border-radius: 6px;
  transition: width 1s cubic-bezier(.4,0,.2,1);
}
.prog-meta {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--sub);
}

/* ─── Log Form ─── */
.log-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-m); padding: 16px;
  margin: 0 16px 12px; box-shadow: var(--shadow-card);
}
.input-group { margin-bottom: 12px; }
.input-label-text {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--sub); margin-bottom: 6px;
}
.input-field {
  width: 100%; padding: 11px 14px;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--radius-s); font-size: 16px; color: var(--text);
  outline: none; transition: border-color var(--transition);
}
.input-field:focus { border-color: var(--orange); }
.input-row-2 { display: flex; gap: 10px; }
.input-row-2 .input-group { flex: 1; }
.unit-label { font-size: 13px; color: var(--sub); align-self: flex-end; padding-bottom: 12px; }

.btn-primary {
  width: 100%; height: 50px;
  background: linear-gradient(135deg, var(--orange), var(--yellow));
  color: #fff; border: none; border-radius: var(--radius-s);
  font-size: 16px; font-weight: 700;
  box-shadow: 0 4px 16px rgba(249,115,22,0.3);
  transition: all var(--transition);
}
.btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(249,115,22,0.2); }

/* ─── Chart ─── */
.chart-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-m); padding: 16px;
  margin: 0 16px 12px; box-shadow: var(--shadow-card);
}
.chart-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
.bar-chart {
  display: flex; align-items: flex-end; gap: 6px;
  height: 112px; margin-bottom: 4px;
}
.bar-group {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end; gap: 3px; height: 100%;
}
.bars {
  display: flex; gap: 2px; align-items: flex-end;
  width: 100%; justify-content: center; height: 80px;
}
.bar { border-radius: 4px 4px 0 0; transition: height 0.8s ease; min-height: 2px; }
.bar-day { font-size: 10px; color: var(--sub); }
.bar-day.today { color: var(--orange); font-weight: 700; }
.bar-val { font-size: 9px; color: var(--sub); margin-bottom: 2px; min-height: 12px; line-height: 1; }
.chart-legend {
  display: flex; gap: 10px; flex-wrap: wrap;
  font-size: 11px; color: var(--sub); margin-top: 8px;
}
.legend-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; margin-right: 4px; flex-shrink: 0;
}

/* ─── Goals ─── */
.goal-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-m); overflow: hidden;
  margin: 0 16px 12px; box-shadow: var(--shadow-card);
}
.goal-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border); gap: 12px;
}
.goal-row:last-child { border-bottom: none; }
.goal-name { font-size: 14px; font-weight: 700; }
.goal-sub  { font-size: 12px; color: var(--sub); margin-top: 2px; }
.goal-badge {
  font-size: 12px; font-weight: 700;
  padding: 4px 12px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.goal-badge.done { background: var(--green-light); color: #16a34a; }
.goal-badge.pend { background: var(--orange-light); color: var(--orange); }

/* ─── History ─── */
.history-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
.history-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-m); padding: 12px 14px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: var(--shadow-card);
  animation: fadeIn 0.3s ease;
  position: relative;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.hist-main { flex: 1; padding-right: 32px; }
.hist-cert { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.hist-note { font-size: 12px; color: var(--sub); }
.hist-hours {
  font-family: 'Nunito', sans-serif;
  font-size: 20px; font-weight: 900; color: var(--orange); flex-shrink: 0;
}
.hist-hours-unit { font-size: 11px; color: var(--sub); font-family: inherit; }
.hist-delete {
  position: absolute; top: 0; right: 0;
  background: none; border: none; font-size: 16px;
  color: var(--sub); padding: 0;
  border-radius: 6px; opacity: 0.45; line-height: 1;
  transition: opacity var(--transition), background var(--transition);
  min-width: 44px; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
}
.hist-delete:active { opacity: 1; background: var(--red-light); color: var(--red); }
.hist-total {
  font-size: 12px; color: var(--sub); font-weight: 600;
}
.hist-total span { color: var(--orange); font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; }
.btn-show-more {
  display: block; width: calc(100% - 32px); margin: 10px 16px 0;
  padding: 10px; border: 1.5px solid var(--border);
  background: var(--surface); border-radius: var(--radius-s);
  font-size: 13px; font-weight: 700; color: var(--sub);
  transition: all var(--transition);
}
.btn-show-more:active { border-color: var(--orange); color: var(--orange); }

/* ─── Settings ─── */
.settings-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-m); overflow: hidden;
  margin: 0 16px 12px; box-shadow: var(--shadow-card);
}
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border); gap: 12px;
}
.settings-row:last-child { border-bottom: none; }
.settings-label { font-size: 15px; font-weight: 500; }
.settings-sub { font-size: 12px; color: var(--sub); margin-top: 1px; }
.settings-input {
  padding: 7px 12px; border: 1.5px solid var(--border);
  border-radius: var(--radius-s); font-size: 15px;
  font-family: 'Nunito', sans-serif; font-weight: 700;
  background: var(--bg); color: var(--text); text-align: right;
  width: 100px; outline: none; transition: border-color var(--transition);
}
.settings-input:focus { border-color: var(--orange); }
.settings-input[type="date"] { width: 138px; font-family: inherit; font-size: 14px; }

/* ─── Exam List in Settings ─── */
.exam-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-m); margin: 0 16px 10px;
  box-shadow: var(--shadow-card); overflow: hidden;
}
.exam-item-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.exam-item-name {
  font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px;
}
.exam-item-emoji {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.btn-exam-delete {
  padding: 4px 10px; border: 1.5px solid #fecaca;
  background: var(--red-light); color: var(--red);
  border-radius: 20px; font-size: 12px; font-weight: 700;
  transition: all var(--transition);
  min-height: 44px;
}
.btn-exam-delete:active { background: var(--red); color: #fff; }
.btn-exam-delete:disabled { opacity: 0.35; pointer-events: none; }

/* ─── DBピッカー連携表示 ─── */
.db-pick-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.db-pick-badge {
  flex: 1; min-width: 0;
  padding: 8px 12px; border-radius: var(--radius-s);
  background: var(--orange-light); border: 1.5px solid var(--orange-mid);
  font-size: 13px; font-weight: 700; color: var(--orange);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.db-pick-badge.empty {
  background: var(--bg); border-color: var(--border);
  color: var(--sub); font-weight: 500;
}
.btn-db-pick {
  flex-shrink: 0; height: 44px; padding: 0 14px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius-s); font-size: 13px; font-weight: 700;
  color: var(--sub); white-space: nowrap;
  transition: all var(--transition);
}
.btn-db-pick:active { border-color: var(--orange); color: var(--orange); }

/* ─── Add Exam Form ─── */
.add-exam-card {
  background: var(--surface); border: 2px dashed var(--orange-mid);
  border-radius: var(--radius-m); padding: 20px 16px;
  margin: 0 16px 12px;
}
.add-exam-title {
  font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--orange);
}
.emoji-picker {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
}
.emoji-opt {
  width: 40px; height: 40px; border-radius: 10px;
  border: 2px solid var(--border); background: var(--bg);
  font-size: 20px; display: flex; align-items: center; justify-content: center;
  transition: all var(--transition); cursor: pointer;
}
.emoji-opt.selected { border-color: var(--orange); background: var(--orange-light); }
.btn-add-exam {
  width: 100%; height: 46px;
  background: var(--orange-light); color: var(--orange);
  border: 2px solid var(--orange-mid); border-radius: var(--radius-s);
  font-size: 15px; font-weight: 700;
  transition: all var(--transition);
}
.btn-add-exam:active { background: var(--orange); color: #fff; }

/* ─── Hero Links ─── */
.hero-links {
  position: relative; z-index: 1;
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-top: 16px; padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.25);
}
.hero-link-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 20px; padding: 6px 14px;
  font-size: 12px; font-weight: 700; color: #fff;
  text-decoration: none; white-space: nowrap;
  transition: background var(--transition), transform var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.hero-link-btn:active { background: rgba(255,255,255,0.38); transform: scale(0.96); }
.hero-link-icon { font-size: 13px; }

/* ─── Settings: Link manager ─── */
.link-list { padding: 0 16px 4px; display: flex; flex-direction: column; gap: 6px; }
.link-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-s); padding: 8px 12px;
}
.link-item-info { flex: 1; min-width: 0; }
.link-item-label { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-item-url   { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-link-delete {
  flex-shrink: 0; background: none; border: none;
  font-size: 16px; color: var(--sub); padding: 0;
  opacity: 0.5; border-radius: 4px;
  transition: opacity var(--transition), color var(--transition);
  min-width: 44px; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
}
.btn-link-delete:active { opacity: 1; color: var(--red); }
.add-link-row {
  display: flex; gap: 8px; padding: 10px 16px 14px; align-items: flex-end;
}
.add-link-row .input-group { margin-bottom: 0; }
.add-link-row .input-field { font-size: 14px; padding: 8px 12px; }
.btn-link-add {
  flex-shrink: 0; height: 42px; padding: 0 14px;
  background: var(--orange-light); color: var(--orange);
  border: 1.5px solid var(--orange-mid); border-radius: var(--radius-s);
  font-size: 13px; font-weight: 700; white-space: nowrap;
  transition: all var(--transition);
}
.btn-link-add:active { background: var(--orange); color: #fff; }
.link-section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 6px; border-top: 1px solid var(--border);
}
.link-section-title { font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: 0.5px; }

/* ─── Motivation ribbon ─── */
.motivation-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, var(--orange-light), #fef9c3);
  border: 1px solid var(--orange-mid);
  border-radius: 20px; padding: 5px 12px;
  font-size: 13px; font-weight: 700; color: #92400e;
  margin: 0 16px 14px;
}

/* ─── Onboarding ─── */
.onboard-banner {
  margin: 0 16px 14px;
  background: var(--blue-light); border: 1.5px solid #bfdbfe;
  border-radius: var(--radius-m); padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
}
.onboard-banner-text { flex: 1; font-size: 13px; font-weight: 600; color: #1d4ed8; line-height: 1.5; }
.onboard-banner-btn {
  flex-shrink: 0; padding: 6px 14px; background: #3b82f6;
  color: #fff; border: none; border-radius: 20px;
  font-size: 12px; font-weight: 700;
}

/* ─── Empty State ─── */
.empty-state { text-align: center; padding: 48px 24px; color: var(--sub); }
.empty-icon  { font-size: 52px; margin-bottom: 12px; }
.empty-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty-desc  { font-size: 14px; }

/* ─── Bottom Nav ─── */
nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: rgba(255,253,249,0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: var(--z-nav);
}
.nav-btn {
  flex: 1; height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; background: none; border: none;
  font-size: 10px; color: var(--sub); font-weight: 600;
  transition: color var(--transition);
}
.nav-btn .nav-icon { font-size: 22px; }
.nav-btn.active { color: var(--orange); }

/* ─── Toast ─── */
.toast {
  position: fixed;
  bottom: max(calc(64px + 12px), calc(64px + 12px + env(safe-area-inset-bottom)));
  left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--text); color: #fff;
  font-size: 13px; font-weight: 700;
  padding: 10px 20px; border-radius: 30px;
  z-index: var(--z-toast); white-space: nowrap;
  transition: transform 0.3s ease;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ─── 資格バッジ（手当額表示） ─── */
.cert-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700;
  padding: 2px 9px; border-radius: 20px;
  white-space: nowrap; flex-shrink: 0;
  vertical-align: middle;
}
.cert-badge.special-1 { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
.cert-badge.special-2 { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
.cert-badge.special-3 { background: #fff3e8; color: #c2410c; border: 1px solid #fed7aa; }
.cert-badge.special-4 { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
.cert-badge.self-A    { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; }
.cert-badge.self-B    { background: #ddd6fe; color: #5b21b6; border: 1px solid #c4b5fd; }
.cert-badge.self-C    { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
.cert-badge.self-D    { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
.cert-badge.snow      { background: #cffafe; color: #0e7490; border: 1px solid #a5f3fc; }
.cert-badge.ms        { background: linear-gradient(135deg, #dbeafe, #ede9fe); color: #5b21b6; border: 1px solid #c7d2fe; }
.cert-badge.no-cert   { background: var(--bg); color: var(--sub); border: 1px solid var(--border); }
.cert-badge-flame { font-size: 10px; }

/* Hero内の手当額バッジ（上書き：白背景） */
.hero-card .cert-badge {
  background: rgba(255,255,255,0.92);
  border-color: rgba(255,255,255,0.5);
}

/* ─── 期待リターンセクション ─── */
.return-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-m); padding: 14px 16px;
  margin: 0 16px 12px; box-shadow: var(--shadow-card);
}
.return-card.has-data { border-color: var(--orange-mid); background: linear-gradient(180deg, var(--orange-light) 0%, var(--surface) 60%); }
.return-title {
  font-size: 12px; font-weight: 700; color: var(--sub);
  text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 4px;
}
.return-rows { display: flex; flex-direction: column; gap: 6px; }
.return-row {
  display: flex; justify-content: space-between; align-items: baseline;

}
.return-row .label { color: var(--sub); font-weight: 600; }

.return-note { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.4; }
.return-note.alert { color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 6px 10px; }
.return-no-data {
  text-align: center; padding: 12px 0; font-size: 13px; color: var(--sub);
}
.return-no-data button {
  margin-top: 8px; padding: 6px 14px;
  background: var(--orange-light); color: var(--orange);
  border: 1px solid var(--orange-mid); border-radius: 20px;
  font-size: 12px; font-weight: 700;
}

/* ─── アラートバナー（廃止予定など） ─── */
.alert-banner {
  margin: 0 16px 12px;

.alert-banner.low  { background: var(--blue-light); border: 1px solid #bfdbfe; color: #1d4ed8; }
.alert-banner-icon { font-size: 18px; flex-shrink: 0; }

/* ─── カタログページ ─── */

  margin: 0 16px 12px;
  position: relative;
}
.catalog-search input {
  width: 100%; padding: 12px 14px 12px 40px;

}

}

.catalog-filters {
  display: flex; gap: 8px; padding: 0 16px 12px;

}

.filter-chip {

  border-radius: 20px; border: 1.5px solid var(--border);

  color: var(--sub); white-space: nowrap;

  border-color: var(--orange);

.catalog-result-count {
  padding: 0 16px 8px;

.catalog-list { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }

.modal-btn.cancel  { background: var(--border); color: var(--sub); }

.modal-btn.primary { background: var(--orange); color: #fff; }

<div id="app">
  <header>
    <div class="header-logo">🎯 合格ナビ</div>

  <main>
    <!-- ページ：ホーム -->

      <div class="hero-wrap">
        <div class="cert-tab-row" id="certTabs"></div>

      <div class="section-head">
        <span class="section-title">今週の目標</span>
      </div>
      <div class="goal-card" id="goalCard"></div>

      <div style="padding:16px 16px 0;">

<script>
// ─── Utils ─────────────────────────────────────────────────
// === 資格データベース（PDFを完全網羅） ====================
// ============================================================
// 資格データベース（2026年02月改訂版）
// PDFの全資格を網羅。program × group × seriesで分類。
// ============================================================

// 制度（program）
//   special  : 専門技能手当（月額支給）
//   self     : 自己啓発支援金（合格時一時金）
//   ms       : Microsoft特別措置（専門技能手当・5年期限撤廃あり）
//   snow     : ServiceNow特別措置（自己啓発支援金）
//
// 区分（group）
//   special: '1','2','3','4'   → 月3万/2万/1万/5千円
//   self:    'A','B','C','D'   → 5万/3万/1万/受験料のみ
//   ms:      '1','2','3','4'   → 月3万/2万/1万/5千円（特別措置で5年期限撤廃）
//   snow:    特別な料金体系（一時金）

// ─── 月額/一時金マスター ─────────────────────────────────────
const PAYMENT_MASTER = {
  special: { '1': { monthly: 30000, label: '月額 3万円' },
             '2': { monthly: 20000, label: '月額 2万円' },

// 制度ラベル

    special: '専門技能手当',
    self:    '自己啓発支援金',
    ms:      'MS特別措置',
    snow:    'ServiceNow特別措置',

// 区分ラベル（◯群／◯群）
function groupLabel(program, group) {
  if (program === 'special' || program === 'ms') return `${group}群`;
  if (program === 'self') return `${group}群`;
  if (program === 'snow') return '特別';
  return group;
}

// 月額・一時金情報
function getPayment(entry) {
  if (entry.program === 'snow') {
    return { monthly: 0, onetime: entry.onetime || 0, label: entry.label || '' };
  }
  const p = PAYMENT_MASTER[entry.program]?.[entry.group];
  if (!p) return { monthly: 0, onetime: 0, label: '' };
  return {
    monthly: p.monthly || 0,
    onetime: p.onetime || 0,
    label: p.label || '',
  };
}

// 期待リターン情報
function calcReturn(entry) {
  const p = getPayment(entry);
  // 受験料：全エントリで会社支給扱い（PDF上、◯マークは支給対象）
  const examFee = '会社支給';
  if (p.onetime > 0) {
    return {
      type: 'onetime',
      onetime: p.onetime,
      monthly: 0,
      yearly: 0,
      fiveYear: p.onetime,
      examFee,
    };
  }
  if (p.monthly > 0) {
    const yearly = p.monthly * 12;
    const fiveYear = yearly * 5;
    // MS特別措置の対象期間中は5年期限が撤廃される
    const noLimit = entry.program === 'ms';
    return {
      type: 'monthly',
      monthly: p.monthly,
      yearly,
      fiveYear,
      noLimit,
      examFee,
    };
  }
  return { type: 'none', monthly: 0, onetime: 0, yearly: 0, fiveYear: 0, examFee };
}

// アラート判定（廃止予定・特別措置改定など）
function checkAlerts(entry, today = new Date()) {
  const alerts = [];
  // 廃止予定資格
  if (entry.retiredAt) {
    const retired = new Date(entry.retiredAt);
    const diff = Math.ceil((retired - today) / 86400000);
    if (diff > 0 && diff <= 365) {
      alerts.push({ kind: 'retire', urgency: diff <= 90 ? 'high' : 'mid',
        message: `${entry.retiredAt}に廃止予定（あと${diff}日）` });
    } else if (diff <= 0) {
      alerts.push({ kind: 'retired', urgency: 'expired',
        message: '既に廃止済み' });
    }
  }
  // MS特別措置：改定タイミング警告
  if (entry.program === 'ms') {
    const review = new Date(MS_REVIEW_DATE);
    const diff = Math.ceil((review - today) / 86400000);
    if (diff > 0 && diff <= 180) {
      alerts.push({ kind: 'review', urgency: diff <= 90 ? 'mid' : 'low',
        message: `特別措置改定まで${diff}日（5年期限撤廃の対象外になる可能性）` });
    }
  }
  // ServiceNow特別措置：終了タイミング
  if (entry.program === 'snow') {
    const end = new Date(SNOW_PERIOD_END);
    const diff = Math.ceil((end - today) / 86400000);
    if (diff > 0 && diff <= 365) {
      alerts.push({ kind: 'snow-end', urgency: diff <= 90 ? 'high' : 'mid',
        message: `特別措置は${SNOW_PERIOD_END}まで（あと${diff}日）` });
    }
  }
  return alerts;
}

// 名前で検索（部分一致）
function searchCertDb(query, filters = {}) {
  const q = (query || '').toLowerCase().trim();
  return CERT_DB.filter(c => {
    if (filters.program && c.program !== filters.program) return false;
    if (filters.group   && c.group   !== filters.group)   return false;
    if (filters.series  && c.series  !== filters.series)  return false;
    if (!q) return true;
    const text = `${c.name} ${c.code || ''} ${c.series}`.toLowerCase();
    return text.includes(q);
  });
}

// 系列リスト（フィルタUI用）
function listSeries(program = null) {
  const set = new Set();
  CERT_DB.forEach(c => {
    if (program && c.program !== program) return;
    set.add(c.series);
  });
  return [...set].sort((a, b) => a.localeCompare(b, 'ja'));
}

// 区分リスト（フィルタUI用）
function listGroups(program = null) {
  const set = new Set();
  CERT_DB.forEach(c => {
    if (program && c.program !== program) return;
    set.add(c.group);
  });
  return [...set].sort();
}

// ─── Calc Helpers ───────────────────────────────────────────
function daysUntil(dateStr) {
  const target = new Date(dateStr);
  const now = new Date();
  now.setHours(0,0,0,0); target.setHours(0,0,0,0);
  return Math.round((target - now) / 86400000);
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function getTotalHours(examId) {
  return state.logs.filter(l => l.examId === examId).reduce((s, l) => s + l.hours, 0);
}

function getWeekDays() {
  const today = new Date();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d.toISOString().split('T')[0]);
  }
  return days;
}

function getWeekHours(examId) {
  const weekDays = getWeekDays();
  return state.logs
    .filter(l => l.examId === examId && weekDays.includes(l.date))
    .reduce((s, l) => s + l.hours, 0);
}

function getDayHours(examId, dateStr) {
  return state.logs
    .filter(l => l.examId === examId && l.date === dateStr)
    .reduce((s, l) => s + l.hours, 0);
}

function getProgress(exam) {
  return Math.min(100, Math.round((getTotalHours(exam.id) / exam.targetHours) * 100));
}

function getDailyRequired(exam) {
  const days = daysUntil(exam.examDate);
  if (days < 0) return 'past';
  if (days === 0) return null;
  const remaining = Math.max(0, exam.targetHours - getTotalHours(exam.id));
  if (remaining === 0) return 0;
  return remaining / days;
}

// ─── Streak ────────────────────────────────────────────────
function updateStreak() {
  const today = new Date().toISOString().split('T')[0];
  if (!state.logs.some(l => l.date === today)) return;
  const last = state.streak.lastDate;
  if (last === today) return;
  const yesterday = (() => {
    const d = new Date(); d.setDate(d.getDate() - 1);
    return d.toISOString().split('T')[0];
  })();
  state.streak.count = (last === yesterday) ? state.streak.count + 1 : (last === '' ? 1 : 1);
  state.streak.lastDate = today;
}

// ─── Plan vs Actual ────────────────────────────────────────
function getPlanVsActual(exam) {
  const examDate = new Date(exam.examDate);
  const totalTarget = exam.targetHours;
  const sorted = state.logs.filter(l => l.examId === exam.id).map(l => l.date).sort();
  const startDate = sorted.length ? new Date(sorted[0]) : (() => { const d = new Date(examDate); d.setDate(d.getDate() - 90); return d; })();
  const totalDays = Math.max(1, Math.round((examDate - startDate) / 86400000));
  const elapsed   = totalDays - Math.max(0, daysUntil(exam.examDate));
  const planned   = Math.min(totalTarget, (totalTarget / totalDays) * Math.max(0, elapsed));
  const actual    = getTotalHours(exam.id);
  return {
    planned: Math.round(planned * 10) / 10,
    actual:  Math.round(actual  * 10) / 10,
    diff:    Math.round((actual - planned) * 10) / 10
  };
}

// ─── Render: Goals ─────────────────────────────────────────
function renderGoals() {
  const el = document.getElementById('goalCard');
  if (!state.exams.length) { el.innerHTML = ''; return; }
  el.innerHTML = state.exams.map(exam => {
    const week  = getWeekHours(exam.id);
    const goal  = exam.weeklyHours;
    const ratio = goal > 0 ? Math.round((week / goal) * 100) : 0;
    const done  = week >= goal;
    return `
    <div class="goal-row">
      <div>
        <div class="goal-name">${escapeHtml(exam.emoji)} ${escapeHtml(exam.name)}</div>
        <div class="goal-sub">今週 ${week.toFixed(1)}h / 目標 ${goal}h（${ratio}%）</div>
      </div>
      <span class="goal-badge ${done ? 'done' : 'pend'}">${done ? '🎉 達成！' : `あと ${(goal - week).toFixed(1)}h`}</span>
    </div>`;
  }).join('');
}

// ─── Render: Bar Chart ─────────────────────────────────────
function renderBarChart() {
  const days    = getWeekDays();
  const todayStr = new Date().toISOString().split('T')[0];
  const labels  = ['月','火','水','木','金','土','日'];

  const maxH = Math.max(1, ...days.map(d =>
    state.exams.reduce((s, e) => s + getDayHours(e.id, d), 0)
  ));

  document.getElementById('barChart').innerHTML = days.map((d, i) => {
    const isFuture = d > todayStr;
    const isToday  = d === todayStr;
    const total    = state.exams.reduce((s, e) => s + getDayHours(e.id, d), 0);
    const valLabel = total > 0 ? total.toFixed(1) : '';
    const bars = state.exams.map(e => {
      const h  = getDayHours(e.id, d);
      const px = Math.max(h > 0 ? 4 : 0, Math.round((h / maxH) * 72));
      return `<div class="bar" style="height:${px}px;background:${escapeHtml(e.color)};width:${Math.max(6, Math.floor(40/state.exams.length))}px;"></div>`;
    }).join('');
    return `
    <div class="bar-group" style="${isFuture ? 'opacity:0.3' : ''}">
      <div class="bar-val">${valLabel}</div>
      <div class="bars">${bars}</div>
      <div class="bar-day${isToday ? ' today' : ''}">${labels[i]}</div>
    </div>`;
  }).join('');

  // 凡例
  document.getElementById('chartLegend').innerHTML = state.exams.map(e =>
    `<span><span class="legend-dot" style="background:${escapeHtml(e.color)}"></span>${escapeHtml(e.emoji)} ${escapeHtml(e.name)}</span>`
  ).join('');
}

// ─── Render: History ───────────────────────────────────────
function renderHistory() {
  const el          = document.getElementById('historyList');
  const showMoreWrap = document.getElementById('showMoreWrap');
  const histTotal   = document.getElementById('histTotal');
  const allLogs     = [...state.logs].reverse();
  const page        = state.ui.historyPage || 1;
  const showCount   = page * HISTORY_PAGE;
  const logs        = allLogs.slice(0, showCount);
  const hasMore     = allLogs.length > showCount;

  const grandTotal = state.logs.reduce((s, l) => s + l.hours, 0);
  histTotal.innerHTML = allLogs.length > 0
    ? `合計 <span>${grandTotal.toFixed(1)}h</span>` : '';

  if (!allLogs.length) {
    el.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">📖</div>
      <div class="empty-title">まだ記録がありません</div>
      <div class="empty-desc">上のフォームから学習を記録しよう！</div>
    </div>`;
    showMoreWrap.innerHTML = '';
    return;
  }

  el.innerHTML = logs.map(l => {
    const exam = getExam(l.examId);
    const name = exam ? `${escapeHtml(exam.emoji)} ${escapeHtml(exam.name)}` : '（削除済みの試験）';
    const color = exam?.color || 'var(--sub)';
    const logId = l.id ? escapeHtml(l.id) : '';
    return `
    <div class="history-item" data-id="${logId}">
      <div class="hist-main">
        <div class="hist-cert" style="color:${color}">${name}</div>
        <div class="hist-note">${escapeHtml(l.note || '—')} · ${escapeHtml(l.date)}</div>

        <div class="hist-hours">${escapeHtml(String(l.hours))}<span class="hist-hours-unit">h</span></div>
      </div>
      ${logId ? `<button class="hist-delete" data-delete-id="${logId}" aria-label="この記録を削除">✕</button>` : ''}
    </div>`;
  }).join('');

  showMoreWrap.innerHTML = hasMore
    ? `<button class="btn-show-more tappable" onclick="showMoreHistory()">さらに表示（残り ${allLogs.length - showCount}件）</button>`
    : '';
}

}

// ─── 資格DB連携：ヘルパー ─────────────────────────────────
function getExamCertEntry(exam) {
  if (!exam || !exam.certDbId) return null;
  return CERT_DB.find(c => c.dbId === exam.certDbId) || null;
}

function renderCertBadge(entry, opts = {}) {
  if (!entry) {
    if (opts.showEmpty) {
      return `<span class="cert-badge no-cert" title="資格DB未連携">手当未設定</span>`;
    }
    return '';
  }
  const flame = entry.program === 'ms' ? '<span class="cert-badge-flame">🔥</span>' : '';
  const cls = entry.program === 'snow' ? 'snow' :
              entry.program === 'ms'   ? 'ms'   :
              `${entry.program}-${entry.group}`;
  const p = getPayment(entry);
  // 月額／一時金をアイコンで明示
  const typeIcon = (p.monthly > 0) ? '🔄' : (p.onetime > 0) ? '🎁' : '';
  const titleText = `${escapeHtml(programLabel(entry.program))} / ${escapeHtml(groupLabel(entry.program, entry.group))} / ${p.monthly > 0 ? '月額支給' : p.onetime > 0 ? '合格一時金' : '受験料のみ'}`;
  return `<span class="cert-badge ${cls}" title="${titleText}">${flame}${typeIcon} ${escapeHtml(p.label)}</span>`;
}

function fmtMoney(n) {
  return '¥' + Number(n).toLocaleString('ja-JP');
}

// ─── Render: 期待リターンセクション（ホーム） ─────────────
function renderReturnSection() {
  const wrap = document.getElementById('returnSection');
  if (!wrap) return;
  const exam = getHeroExam();
  if (!exam) { wrap.innerHTML = ''; return; }
  const entry = getExamCertEntry(exam);
  if (!entry) {
    wrap.innerHTML = `
      <div class="return-card">
        <div class="return-title">💰 合格時のリターン</div>
        <div class="return-no-data">
          この試験は資格DBに紐付いていません<br>
          <button class="tappable" onclick="openCertPicker('${escapeHtml(exam.id)}')">手当情報を選んで紐付ける</button>
        </div>
      </div>`;
    return;
  }
  const ret = calcReturn(entry);
  const alerts = checkAlerts(entry);

  let body = '';
  if (ret.type === 'onetime') {
    body = `
      <div class="return-rows">
        <div class="return-row big">
          <span class="label">合格一時金</span>
          <span class="val">${fmtMoney(ret.onetime)}</span>
        </div>
        <div class="return-row">
          <span class="label">受験料</span>
          <span class="val">${escapeHtml(ret.examFee)} ✓</span>
        </div>
      </div>`;
  } else if (ret.type === 'monthly') {
    body = `
      <div class="return-rows">
        <div class="return-row big">
          <span class="label">月額手当</span>
          <span class="val">${fmtMoney(ret.monthly)}</span>
        </div>
        <div class="return-row">
          <span class="label">年額換算</span>
          <span class="val">${fmtMoney(ret.yearly)}</span>
        </div>
        <div class="return-row">
          <span class="label">${ret.noLimit ? '累計（合格後5年期限 撤廃中🔥）' : '累計（合格日から5年間）'}</span>
          <span class="val">${fmtMoney(ret.fiveYear)}${ret.noLimit ? '+' : ''}</span>
        </div>
        <div class="return-row">
          <span class="label">受験料</span>
          <span class="val">${escapeHtml(ret.examFee)} ✓</span>
        </div>
      </div>
      ${ret.noLimit ? '<div class="return-note">🔥 MS特別措置の対象期間中は、通常「合格日から5年間」の支給期限が撤廃されています。</div>' : ''}` ;
  } else {
    // D群：受験料のみ（金銭手当なし）
    body = `
      <div class="return-rows">
        <div class="return-row big">
          <span class="label">受験料</span>
          <span class="val">会社支給 ✓</span>
        </div>
      </div>
      <div class="return-note">合格一時金・月額手当はありませんが、受験料は会社が負担します。</div>`;
  }

  // アラート表示
  let alertHtml = '';
  if (alerts.length) {
    const main = alerts.find(a => a.urgency === 'high') || alerts[0];
    alertHtml = `<div class="return-note alert">⚠️ ${escapeHtml(main.message)}</div>`;
  }

  wrap.innerHTML = `
    <div class="return-card has-data">
      <div class="return-title">💰 合格時のリターン ${renderCertBadge(entry)}</div>
      ${body}
      ${alertHtml}
    </div>`;
}

// ─── Render: 期限アラートバナー（ホーム） ─────────────────
function renderAlertBanners() {
  const wrap = document.getElementById('alertBanners');
  if (!wrap) return;
  // 紐付け済みの試験すべてのアラートを集計
  const items = [];
  state.exams.forEach(ex => {
    const entry = getExamCertEntry(ex);
    if (!entry) return;
    const alerts = checkAlerts(entry);
    alerts.forEach(a => items.push({ ex, entry, alert: a }));
  });
  // 高→中→低の順
  const order = { high: 0, mid: 1, low: 2, expired: 3 };
  items.sort((a, b) => (order[a.alert.urgency] ?? 9) - (order[b.alert.urgency] ?? 9));

  if (!items.length) { wrap.innerHTML = ''; return; }

  // 最大2件まで表示
  wrap.innerHTML = items.slice(0, 2).map(it => `
    <div class="alert-banner ${escapeHtml(it.alert.urgency === 'high' ? 'high' : it.alert.urgency === 'mid' ? 'mid' : 'low')}">
      <span class="alert-banner-icon">⚠️</span>
      <div><strong>${escapeHtml(it.ex.name)}</strong>：${escapeHtml(it.alert.message)}</div>
    </div>
  `).join('');
}

function renderPickerList() {
  const q = document.getElementById('pickerSearch')?.value || '';
  const results = searchCertDb(q).slice(0, 50);
  const list = document.getElementById('pickerList');
  if (!list) return;
  // イベント委譲：初回のみバインド（innerHTML書き換えのたびに付け直さない）
  if (!list._bound) {
    list._bound = true;
    list.addEventListener('click', e => {
      const el = e.target.closest('[data-pick]');
      if (el) applyCertPick(el.dataset.pick);
    });
  }
  let html = `<div class="cert-pick-item none" data-pick="__none__">
    <span class="cert-pick-name">紐付けを解除</span>
  </div>`;
  if (!results.length) {

  } else {
    html += results.map(c => `
      <div class="cert-pick-item" data-pick="${escapeHtml(c.dbId)}">
        <span class="cert-pick-name">${escapeHtml(c.name)}${c.code ? ' (' + escapeHtml(c.code) + ')' : ''}</span>
        ${renderCertBadge(c)}
      </div>`).join('');
  }
  list.innerHTML = html;
}
function applyCertPick(dbId) {
  const exam = getExam(_pickerForExamId);
  if (!exam) { closeModal(); return; }
  exam.certDbId = (dbId === '__none__') ? null : dbId;
  saveState();
  closeModal();
  haptic();
  render();
  if (exam.certDbId) {
    const entry = CERT_DB.find(c => c.dbId === exam.certDbId);
    showToast(`✅ 「${entry?.name || ''}」を紐付けました`);
  } else {
    showToast('✅ 紐付けを解除しました');
  }
}

// ─── Render: カタログページ ──────────────────────────────
let _catalogState = { q: '', program: '', group: '' };
function renderCatalogFilters() {
  const programs = [
    { id: '',        label: 'すべて' },
    { id: 'special', label: '専門技能手当' },
    { id: 'ms',      label: 'MS特別措置' },
    { id: 'snow',    label: 'ServiceNow' },
    { id: 'self',    label: '自己啓発支援金' },
  ];
  document.getElementById('catalogProgramFilters').innerHTML = programs.map(p =>
    `<button class="filter-chip tappable${_catalogState.program === p.id ? ' active' : ''}" data-prog="${escapeHtml(p.id)}">${escapeHtml(p.label)}</button>`
  ).join('');

  // 区分フィルタ（program に応じて変化）
  let groups = [];
  if (_catalogState.program === 'special' || _catalogState.program === 'ms') {
    groups = [
      { id: '', label: '全区分' },
      { id: '1', label: '1群（月3万）' },
      { id: '2', label: '2群（月2万）' },
      { id: '3', label: '3群（月1万）' },
    ];
  } else if (_catalogState.program === 'self') {
    groups = [
      { id: '', label: '全区分' },
      { id: 'A', label: 'A群（5万）' },
      { id: 'B', label: 'B群（3万）' },
      { id: 'C', label: 'C群（1万）' },
      { id: 'D', label: 'D群（受験料）' },
    ];
  }
  document.getElementById('catalogGroupFilters').innerHTML = groups.map(g =>
    `<button class="filter-chip tappable${_catalogState.group === g.id ? ' active' : ''}" data-grp="${escapeHtml(g.id)}">${escapeHtml(g.label)}</button>`
  ).join('');
}
function renderCatalogList() {
  const results = searchCertDb(_catalogState.q, {
    program: _catalogState.program || undefined,
    group:   _catalogState.group   || undefined,
  });
  document.getElementById('catalogResultCount').innerHTML = `<strong>${results.length}</strong> 件の資格`;

  const list = document.getElementById('catalogList');
  if (!results.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">該当する資格がありません</div>
        <div class="empty-desc">検索ワードやフィルタを変えてみてください</div>
      </div>`;
    return;
  }
  list.innerHTML = results.slice(0, 200).map(c => {
    const ret = calcReturn(c);
    const isOwned = state.owned.some(o => o.dbId === c.dbId);
    const isLinked = state.exams.some(e => e.certDbId === c.dbId);
    return `
    <div class="catalog-item">
      <div class="catalog-item-head">
        <div class="catalog-item-name">${escapeHtml(c.name)}${c.code ? ' <span style="color:var(--sub);font-weight:600;">(' + escapeHtml(c.code) + ')</span>' : ''}</div>
        ${renderCertBadge(c)}
      </div>
      <div class="catalog-item-meta">
        <span class="program-tag">${escapeHtml(programLabel(c.program))}</span>
        <span>${escapeHtml(c.series)}</span>
        ${c.retiredAt ? `<span style="color:var(--red);font-weight:700;">廃止予定: ${escapeHtml(c.retiredAt)}</span>` : ''}
      </div>
      <div class="catalog-item-actions">
        <button class="catalog-action-btn tappable" data-cat-add="${escapeHtml(c.dbId)}" ${isLinked ? 'disabled style="opacity:0.5"' : ''}>
          ${isLinked ? '✓ 学習中' : '＋ 学習中の試験に追加'}
        </button>
        <button class="catalog-action-btn secondary tappable" data-cat-own="${escapeHtml(c.dbId)}" ${isOwned ? 'disabled style="opacity:0.5"' : ''}>
          ${isOwned ? '✓ 保有済' : '取得済として登録'}
        </button>
      </div>
    </div>`;
  }).join('');
}
function renderCatalog() {
  renderCatalogFilters();
  renderCatalogList();
}

// カタログ：イベント
function bindCatalogEvents() {
  const input = document.getElementById('catalogSearchInput');
  if (input && !input._bound) {
    input._bound = true;
    let timer = null;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        _catalogState.q = input.value;
        renderCatalogList();
      }, 200);
    });
  }
  // 委譲：programフィルタ
  const pf = document.getElementById('catalogProgramFilters');
  if (pf && !pf._bound) {
    pf._bound = true;
    pf.addEventListener('click', e => {
      const btn = e.target.closest('[data-prog]');
      if (!btn) return;
      _catalogState.program = btn.dataset.prog;
      _catalogState.group = ''; // program切替時に区分リセット
      renderCatalog();
    });
  }
  // 委譲：groupフィルタ
  const gf = document.getElementById('catalogGroupFilters');
  if (gf && !gf._bound) {
    gf._bound = true;
    gf.addEventListener('click', e => {
      const btn = e.target.closest('[data-grp]');
      if (!btn) return;
      _catalogState.group = btn.dataset.grp;
      renderCatalogList();
      renderCatalogFilters();
    });
  }
  // 委譲：カタログアイテムのアクション
  const cl = document.getElementById('catalogList');
  if (cl && !cl._bound) {
    cl._bound = true;
    cl.addEventListener('click', e => {
      const addBtn = e.target.closest('[data-cat-add]');
      const ownBtn = e.target.closest('[data-cat-own]');
      if (addBtn && !addBtn.disabled) {
        addExamFromCatalog(addBtn.dataset.catAdd);
      } else if (ownBtn && !ownBtn.disabled) {
        addOwnedFromCatalog(ownBtn.dataset.catOwn);
      }
    });
  }
}

// カタログ→学習中の試験に追加
function addExamFromCatalog(dbId) {
  if (state.exams.length >= MAX_EXAMS) {
    showToast(`⚠️ 試験は最大${MAX_EXAMS}件まで登録できます`); return;
  }
  const entry = CERT_DB.find(c => c.dbId === dbId);
  if (!entry) return;
  const colorIndex = state.exams.length % EXAM_COLORS.length;
  // 試験日：90日後（仮）
  const dd = new Date(); dd.setDate(dd.getDate() + 90);
  const exam = {
    id: newId(),
    name: entry.name,
    emoji: '📘',
    examDate: dd.toISOString().split('T')[0],
    weeklyHours: 5,
    targetHours: 100,
    color: EXAM_COLORS[colorIndex],
    certDbId: dbId,
    links: []
  };
  state.exams.push(exam);
  state.ui.heroExamId = exam.id;
  saveState();
  haptic('heavy');
  showToast(`✅ 「${entry.name}」を追加しました（試験日・目標は設定で調整してください）`);
  showPage('settings');
}

// カタログ→保有資格に追加
function addOwnedFromCatalog(dbId) {
  if (state.owned.some(o => o.dbId === dbId)) return;
  const entry = CERT_DB.find(c => c.dbId === dbId);
  if (!entry) return;
  state.owned.push({
    id: newId(),
    dbId,
    acquiredAt: new Date().toISOString().split('T')[0],
  });
  saveState();
  haptic();
  renderCatalogList();
  showToast(`🏆 「${entry.name}」を保有資格に追加しました`);
}

// ─── Render: 保有資格ページ ──────────────────────────────
function calcOwnedSummary() {
  // 月額系（system／ms）と一時金系（self／snow）を集計
  // 同系列内の重複支給ルールは厳密判定が複雑なので、UIでは概算として全件加算した上で「上限5万円」を併記
  let monthly = 0, onetime = 0;
  state.owned.forEach(o => {
    const e = CERT_DB.find(c => c.dbId === o.dbId);
    if (!e) return;
    const p = getPayment(e);
    monthly += p.monthly || 0;
    onetime += p.onetime || 0;
  });
  return { monthly, onetime };
}

function renderOwnedSummary() {
  const wrap = document.getElementById('ownedSummary');
  if (!wrap) return;
  const sum = calcOwnedSummary();
  const cap = 50000;
  const capped = Math.min(sum.monthly, cap);
  const capPct = Math.min(100, Math.round(sum.monthly / cap * 100));
  const overCap = sum.monthly > cap;

  wrap.innerHTML = `
    <div class="owned-summary">
      <div class="owned-summary-title">🏆 累計手当（月額）</div>
      <div class="owned-summary-val">${fmtMoney(capped)}<span class="unit">/月</span></div>
      <div class="owned-summary-sub">
        <span>${overCap ? `※ 上限5万円のため${fmtMoney(sum.monthly - cap)}は支給対象外` : `年額換算：${fmtMoney(capped * 12)}`}</span>
      </div>
      <div class="owned-cap-bar">
        <div class="owned-cap-fill" style="width:${capPct}%"></div>
      </div>
      <div class="owned-cap-label">月額上限 ${fmtMoney(cap)} まで残り ${fmtMoney(Math.max(0, cap - sum.monthly))}</div>
    </div>
    ${sum.onetime > 0 ? `
    <div class="return-card">
      <div class="return-title">💎 累計一時金（過去取得分）</div>
      <div class="return-rows">
        <div class="return-row big">
          <span class="label">合計</span>
          <span class="val">${fmtMoney(sum.onetime)}</span>
        </div>
      </div>
    </div>` : ''}
  `;
}

function renderOwnedList() {
  const wrap = document.getElementById('ownedList');
  if (!wrap) return;
  if (!state.owned.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🏆</div>
        <div class="empty-title">保有資格が未登録です</div>
        <div class="empty-desc">下のボタンからカタログを開き、取得済みの資格を登録しましょう</div>
      </div>`;
    return;
  }
  wrap.innerHTML = `<div class="owned-list">` + state.owned.map(o => {
    const entry = CERT_DB.find(c => c.dbId === o.dbId);
    if (!entry) {
      return `<div class="owned-item">
        <div class="owned-item-info">
          <div class="owned-item-name">（不明な資格）</div>
          <div class="owned-item-meta">DBから削除された可能性があります</div>
        </div>
        <button class="owned-delete tappable" data-owned-del="${escapeHtml(o.id)}" aria-label="削除">✕</button>
      </div>`;
    }
    const p = getPayment(entry);
    const amt = p.monthly > 0 ? `<span class="v">${fmtMoney(p.monthly)}</span><span class="u">/月</span>` :
                p.onetime > 0 ? `<span class="v">${fmtMoney(p.onetime)}</span><span class="u">一時金</span>` :
                                `<span class="u">手当なし</span>`;
    return `<div class="owned-item">
      <div class="owned-item-info">
        <div class="owned-item-name">${escapeHtml(entry.name)}</div>
        <div class="owned-item-meta">${escapeHtml(programLabel(entry.program))} ・ ${escapeHtml(groupLabel(entry.program, entry.group))} ・ 取得 ${escapeHtml(o.acquiredAt || '—')}</div>
      </div>
      <div class="owned-item-amount">${amt}</div>
      <button class="owned-delete tappable" data-owned-del="${escapeHtml(o.id)}" aria-label="削除">✕</button>
    </div>`;
  }).join('') + `</div>`;
}

function renderOwned() {
  renderOwnedSummary();
  renderOwnedList();
  // 委譲：削除ボタン
  const list = document.getElementById('ownedList');
  if (list && !list._bound) {
    list._bound = true;
    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-owned-del]');
      if (btn) deleteOwned(btn.dataset.ownedDel);
    });
  }
}

function deleteOwned(id) {
  state.owned = state.owned.filter(o => o.id !== id);
  saveState();
  haptic();
  renderOwned();
  showToast('🗑 保有資格から削除しました');
}

// ─── Main Render ───────────────────────────────────────────
function render() {
  const today = new Date();
  document.getElementById('headerDate').textContent =
    `${today.getMonth()+1}/${today.getDate()}(${['日','月','火','水','木','金','土'][today.getDay()]})`;

  if (state.ui.currentPage === 'home') {
    renderCertTabs();
    renderHero();
    renderDailyBanner();
    renderAlertBanners();
    renderReturnSection();
    renderMotivation();
    renderOnboarding();
    renderProgress();
    renderGoals();
  } else if (state.ui.currentPage === 'log') {
    renderLogCertSelect();
    renderBarChart();
    renderHistory();
  } else if (state.ui.currentPage === 'settings') {
    renderSettings();
  } else if (state.ui.currentPage === 'catalog') {
    renderCatalog();
    bindCatalogEvents();
  } else if (state.ui.currentPage === 'owned') {
    renderOwned();
  }
}

// ─── Actions: Log ──────────────────────────────────────────
function addLog() {
  const examId = document.getElementById('logCert').value;
  const hours  = parseFloat(document.getElementById('logHours').value) || 0;
  const note   = document.getElementById('logNote').value.trim();
  if (!examId)      { showToast('⚠️ 試験を選択してください'); return; }
  if (hours <= 0)   { showToast('⚠️ 時間を入力してください'); return; }
  if (hours > 12)   { showToast('⚠️ 1回あたり12時間以内で入力してください'); return; }

  const today   = new Date().toISOString().split('T')[0];
  const logDate = document.getElementById('logDate').value || today;

  state.logs.push({ id: newId(), examId, hours, note, date: logDate, ts: Date.now() });
  if (state.logs.length > MAX_LOGS) state.logs = state.logs.slice(-MAX_LOGS);
  if (logDate === today) updateStreak();
  state.ui.historyPage = 1;
  saveState();

  document.getElementById('logNote').value  = '';
  document.getElementById('logHours').value = '1';
  document.getElementById('logDate').value  = today;
  haptic('heavy');
  render();
  showToast(`✅ ${hours}時間を記録しました！`);
}

// ─── Actions: Exam CRUD ────────────────────────────────────
function addExam() {
  const date   = document.getElementById('newExamDate').value;
  const target = parseInt(document.getElementById('newExamTarget').value) || 0;
  const weekly = parseInt(document.getElementById('newExamWeekly').value) || 0;

  if (!_newExamCertDbId) { showToast('⚠️ 資格DBから試験を選んでください'); return; }
  if (!date)             { showToast('⚠️ 試験日を入力してください'); return; }
  if (target < 10)       { showToast('⚠️ 目標時間は10時間以上で入力してください'); return; }
  if (weekly < 1)        { showToast('⚠️ 週間目標は1時間以上で入力してください'); return; }
  if (state.exams.length >= MAX_EXAMS) { showToast(`⚠️ 試験は最大${MAX_EXAMS}件まで登録できます`); return; }

  const entry = CERT_DB.find(c => c.dbId === _newExamCertDbId);
  const name  = entry?.name || '不明な資格';
  const emoji = entry ? (EMOJI_OPTIONS[CERT_DB.indexOf(entry) % EMOJI_OPTIONS.length]) : '📘';
  const colorIndex = state.exams.length % EXAM_COLORS.length;
  const exam = {
    id: newId(), name, emoji,
    examDate: date, weeklyHours: weekly, targetHours: target,
    color: EXAM_COLORS[colorIndex], certDbId: _newExamCertDbId, links: []
  };
  state.exams.push(exam);
  state.ui.heroExamId = exam.id;
  saveState();

  // フォームリセット
  document.getElementById('newExamDate').value   = '';
  document.getElementById('newExamTarget').value = '';
  document.getElementById('newExamWeekly').value = '';
  _newExamCertDbId = null;
  renderNewExamDbBadge();

  haptic('heavy');
  render();
  showToast(`✅ 「${name}」を追加しました！`);
}

function updateExamField(examId, field, value) {
  const exam = getExam(examId);
  if (!exam) return;
  if (field === 'targetHours' || field === 'weeklyHours') {
    const min = field === 'targetHours' ? 10 : 1;
    value = Math.max(min, parseInt(value) || min);
  }
  exam[field] = value;
  saveState();
  // ホーム表示中なら即反映
  if (state.ui.currentPage === 'home') render();
  showToast('✅ 保存しました');
}

function confirmDeleteExam(examId) {
  if (document.querySelector('.modal-overlay')) return;
  const exam = getExam(examId);
  if (!exam) return;
  const logCount = state.logs.filter(l => l.examId === examId).length;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-title">「${escapeHtml(exam.name)}」を削除しますか？</div>
      <div class="modal-desc">${logCount > 0
        ? `この試験の学習記録 ${logCount}件 もあわせて削除されます。この操作は取り消せません。`
        : 'この操作は取り消せません。'}</div>
      <div class="modal-actions">
        <button class="modal-btn cancel tappable" onclick="closeModal()">キャンセル</button>
        <button class="modal-btn danger tappable" onclick="execDeleteExam('${escapeHtml(examId)}')">削除する</button>
      </div>
    </div>`;
  overlay.addEventListener('click', closeModal);
  overlay.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

function execDeleteExam(examId) {
  const exam = getExam(examId);
  if (!exam) { closeModal(); return; }
  // ログも削除
  state.logs   = state.logs.filter(l => l.examId !== examId);
  state.exams  = state.exams.filter(e => e.id !== examId);
  // heroが消えた場合は先頭に戻す
  if (state.ui.heroExamId === examId) {
    state.ui.heroExamId = state.exams[0]?.id || null;
  }
  saveState();
  closeModal();
  haptic();
  render();
  showToast(`🗑 「${exam.name}」を削除しました`);
}

// ─── Actions: Link CRUD ───────────────────────────────────
function addLink(examId) {
  const exam = getExam(examId);
  if (!exam) return;
  if (!exam.links) exam.links = [];
  if (exam.links.length >= MAX_LINKS) {
    showToast(`⚠️ リンクは最大${MAX_LINKS}件まで登録できます`); return;
  }
  const labelEl = document.getElementById(`newLinkLabel_${examId}`);
  const urlEl   = document.getElementById(`newLinkUrl_${examId}`);
  const label   = labelEl?.value.trim();
  const url     = urlEl?.value.trim();

  if (!label)        { showToast('⚠️ 名前を入力してください'); return; }
  if (!url)          { showToast('⚠️ URLを入力してください'); return; }
  if (!safeUrl(url)) { showToast('⚠️ URLは https:// で始まる形式で入力してください'); return; }

  exam.links.push({ id: newId(), label, url: safeUrl(url) });
  saveState();
  if (labelEl) labelEl.value = '';
  if (urlEl)   urlEl.value   = '';
  haptic();
  // 設定ページのリンクリストだけ更新（全再描画を避ける）
  renderSettings();
  // ホームのヒーローも即更新
  if (state.ui.currentPage === 'home') renderHero();
  showToast(`✅ 「${label}」を追加しました`);
}

function deleteLink(examId, linkId) {
  const exam = getExam(examId);
  if (!exam || !exam.links) return;
  const link = exam.links.find(l => l.id === linkId);
  if (!link) return;
  exam.links = exam.links.filter(l => l.id !== linkId);
  saveState();
  haptic();
  renderSettings();
  if (state.ui.currentPage === 'home') renderHero();
  showToast('🗑 リンクを削除しました');
}

// ─── Actions: Log delete ───────────────────────────────────
function deleteLog(id) {
  if (document.querySelector('.modal-overlay')) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-title">記録を削除しますか？</div>
      <div class="modal-desc">この操作は取り消せません。</div>
      <div class="modal-actions">
        <button class="modal-btn cancel tappable" onclick="closeModal()">キャンセル</button>
        <button class="modal-btn danger tappable" onclick="execDeleteLog('${escapeHtml(id)}')">削除する</button>
      </div>
    </div>`;
  overlay.addEventListener('click', closeModal);
  overlay.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

function execDeleteLog(id) {
  state.logs = state.logs.filter(l => l.id !== id);
  saveState();
  closeModal();
  haptic();
  render();
  showToast('🗑 記録を削除しました');
}

function closeModal() {
  document.querySelector('.modal-overlay')?.remove();
  document.body.style.overflow = '';
}

// ─── Navigation ────────────────────────────────────────────
function showPage(page) {
  state.ui.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    const isActive = b.dataset.page === page;
    b.classList.toggle('active', isActive);
    isActive ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  });
  render();
}

// ─── Toast ─────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ─── Init ──────────────────────────────────────────────────
// イベント委譲：ログ削除
document.getElementById('historyList').addEventListener('click', e => {
  const btn = e.target.closest('[data-delete-id]');
  if (btn) deleteLog(btn.dataset.deleteId);
});

// イベント委譲：リンク削除
document.getElementById('examList').addEventListener('click', e => {
  const btn = e.target.closest('[data-link-id]');
  if (btn) deleteLink(btn.dataset.examId, btn.dataset.linkId);
});

// 日付フィールド初期値
document.getElementById('logDate').value = new Date().toISOString().split('T')[0];

updateStreak();
showPage(state.ui.currentPage || 'home');
</script>
